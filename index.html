<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github User Finder</title>
    <!-- <link rel="stylesheet" href="src/style.css" /> -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  </head>
  <body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-6 font-sans">
    <div class="w-full max-w-4xl">
      <header class="text-center mb-8">
        <h1 class="text-3xl font-bold text-purple-400"></h1>
        <i class="fab fa-github"></i> GitHub User Finder</h1>
        <p class="text-gray-400">Search for any GitHub user to see their profile and repositories</p>
      </header>

      <div class="search-container">
        <input
          type="text"
          id="search"
          placeholder="Enter a GitHub username..."
          autocomplete="off"
          class="flex-1 px-4 py-2 rounded-lg bg-gray-800 text-gray-100 focus:ring-2 focus:ring-purple-400 outline-none"
        />
        <button id="search-btn"
          class="px-6 py-2 rounded-lg bg-purple-400 text-black font-semibold hover:bg-purple-600 transition">Search</button>
      </div>

      <div id="profile-container" class="hidden bg-gray-800 rounded-lg p-6 shadow-md mb-6">
        <div class="flex flex-col md:flex-row items-start gap-6 mb-6">
          <img
            src=""
            alt="Profile avatar"
            id="avatar"
            class="w-24 h-24 rounded-full border-4 border-purple-400 object-cover"
          />
          <div class="flex-1">
            <h2 id="name" class="text-xl font-semibold mb-1"></h2>
            <p id="username" class="text-purple-400 mb-2"></p>
            <p id="bio" class="text-gray-400 mb-4"></p>
            <div class="flex flex-wrap gap-6 text-gray-400 text-sm mb-4">
              <p><i class="fas fa-map-marker-alt text-purple-400 mr-1"></i><span id="location">Not specified</span></p>
              <p><i class="far fa-calendar-alt text-purple-400 mr-1"></i>Joined <span id="joined-date"></span></p>
            </div>
            <a id="profile-link" target="_blank"
              class="inline-block px-4 py-2 bg-purple-400 text-black rounded-full font-semibold hover:bg-purple-600 transition">
              View Profile
            </a>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
          <div class="bg-gray-700/50 rounded-lg p-4 text-center">
            <i class="fas fa-users text-purple-400 mr-1"></i>
            <span id="followers"></span> followers
          </div>
          <div class="bg-gray-700/50 rounded-lg p-4 text-center">
            <i class="fas fa-user-friends text-purple-400 mr-1"></i>
            <span id="following"></span> following
          </div>
          <div class="bg-gray-700/50 rounded-lg p-4 text-center">
            <i class="fas fa-code-branch text-purple-400 mr-1"></i>
            <span id="repos"></span> repositories
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 border-t border-gray-700 pt-4 mb-6">
          <div id="company-container" class="flex items-center gap-2 text-gray-400 text-sm">
            <i class="fas fa-building text-purple-400"></i>
            <span id="company">Not specified</span>
          </div>
          <div id="blog-container" class="flex items-center gap-2 text-gray-400 text-sm">
            <i class="fas fa-link text-purple-400"></i>
            <a id="blog" target="_blank" class="hover:text-purple-300">No website</a>
          </div>
          <div id="twitter-container" class="flex items-center gap-2 text-gray-400 text-sm">
            <i class="fab fa-twitter text-purple-400"></i>
            <a id="twitter" target="_blank" class="hover:text-purple-300">No Twitter</a>
          </div>
        </div>

        <div>
          <h3 class="text-lg font-semibold mb-4 border-b border-gray-700 pb-2">Latest Repositories</h3>
          <div id="repos-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="text-gray-400 text-center py-4">Loading repositories...</div>
          </div>
        </div>
      </div>

      <div id="error-container" class="hidden bg-red-900/30 text-red-400 p-4 rounded-lg text-center">
        <p>No user found. Please try another username.</p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
